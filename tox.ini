[tox]
env_list = py{310,311,312,313}, lint, type, live, man
isolated_build = true
skip_missing_interpreters = true

[testenv]
package = wheel
extras = test
commands = pytest {posargs:tests/unit}

[testenv:live]
package = wheel
extras = test
pass_env =
    SYLVE_LIVE
    SYLVE_SERVER
    SYLVE_TOKEN
    SYLVE_INSECURE
    SYLVE_NODE
    SYLVE_CONFIG
    SYLVE_CONTEXT
    SYLVE_SWAGGER
commands = pytest -m live tests/live

[testenv:lint]
package = wheel
extras = test
deps = pylint==3.2.7
allowlist_externals = ruff
commands =
    ruff check src tests
    ruff format --check src tests
    python -m pylint --errors-only src/sylve_cli

[testenv:type]
package = skip
deps = mypy==1.11.2
commands = python -m mypy

[testenv:man]
skip_install = true
commands = python {toxinidir}/scripts/build_man.py --check
